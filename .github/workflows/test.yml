name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The code uses Python 3.9-compatible syntax; CI targets supported releases conservatively.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run all plugin test suites
        run: |
          python -B -m unittest discover -s plugins/campaign-analysis/tests
          python -B -m unittest discover -s plugins/policy-assistant/tests
          python -B -m unittest discover -s plugins/deliverable-qa/tests
          python -B -m unittest discover -s plugins/segment-planner/tests
          python -B -m unittest discover -s plugins/core-dev/tests

  strict-validation:
    name: Claude Code strict validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.296

      - name: Validate marketplace and plugins
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict plugins/campaign-analysis
          claude plugin validate --strict plugins/policy-assistant
          claude plugin validate --strict plugins/deliverable-qa
          claude plugin validate --strict plugins/segment-planner
          claude plugin validate --strict plugins/core-dev
